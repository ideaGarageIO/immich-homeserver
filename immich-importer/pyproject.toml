[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "takeout2immich"
version = "0.1.0"
description = "Move a Google Photos Takeout export into Immich: download, verify, import, validate, clean up."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "textual>=0.80",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "pillow>=10.0",
]

[project.scripts]
takeout2immich = "takeout2immich.cli:app"
t2i = "takeout2immich.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/takeout2immich"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
